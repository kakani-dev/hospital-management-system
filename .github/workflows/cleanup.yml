# Weekly (and on demand) cleanup.
# Real mode is the default. workflow_dispatch can set dry_run=true to print actions only.
# GitHub: artifacts older than 7 days, caches unused for 7 days.
# Azure (when the OIDC secrets exist): keep the 10 newest sha- tags per service plus every
# tag that is currently deployed; deactivate inactive Container Apps revisions outside the
# newest 3. Never deletes the running image or the revision that has traffic.
# Does not touch medicore-hms-api.
name: Cleanup old artifacts, caches, and revisions

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be deleted without deleting"
        type: boolean
        default: false
      max_age_days:
        description: "Delete artifacts and caches older than / unused for this many days"
        required: false
        default: "7"

permissions:
  contents: read

concurrency:
  group: cleanup
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-medicore-hms-dev
  ACR_NAME: acrmedicorehmsdev

jobs:
  github:
    name: Delete stale artifacts and caches
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '7' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - name: Delete stale artifacts and caches
        run: bash .github/scripts/cleanup-github.sh

  azure:
    name: Prune registry tags and inactive revisions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - name: Azure OIDC secrets present?
        id: gate
        run: |
          if [[ -n "$AZURE_CLIENT_ID" && -n "$AZURE_TENANT_ID" && -n "$AZURE_SUBSCRIPTION_ID" ]]; then
            echo "ready=true" >>"$GITHUB_OUTPUT"
          else
            echo "ready=false" >>"$GITHUB_OUTPUT"
            echo "Azure OIDC secrets are not set, so registry and revision cleanup was skipped. Run scripts/azure-oidc-setup.sh once." >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: azure/login@v2
        if: steps.gate.outputs.ready == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Prune registry tags and inactive revisions
        if: steps.gate.outputs.ready == 'true'
        run: bash .github/scripts/aca-cleanup-azure.sh

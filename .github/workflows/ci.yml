name: CI

# Path filters decide which heavy jobs are affected. Each affected job also skips when a
# pass marker for its input hash is already in actions/cache (key <job>-<hash>), saved
# only after that job succeeds. A failed job has no marker, so the next push reruns it
# even if the new commit only touches other files. schedule and workflow_dispatch ignore
# the marker and run every heavy job.
#
# The four branch-protection names are reporter jobs. They succeed when the matching
# heavy job was skipped, and fail when that job or `changes` failed or was cancelled.
# `ci-ok` fails the workflow if any needed job failed or was cancelled.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly full run on the default branch (main). Does not share a concurrency
    # group with push CI, so it cannot cancel a main deploy chain.
    - cron: "17 4 * * *"

permissions:
  contents: read
  # paths-filter lists pull-request files with the GitHub API. An explicit
  # permissions block drops every scope that is not named here.
  pull-requests: read
  actions: write

concurrency:
  group: ${{ github.event_name == 'schedule' && format('ci-nightly-{0}', github.ref) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  NODE_VERSION: "24"
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      full: ${{ steps.mode.outputs.full }}
      run_web: ${{ steps.plan.outputs.run_web }}
      run_api: ${{ steps.plan.outputs.run_api }}
      run_database: ${{ steps.plan.outputs.run_database }}
      run_prototype: ${{ steps.plan.outputs.run_prototype }}
      run_e2e: ${{ steps.plan.outputs.run_e2e }}
      run_mocked: ${{ steps.plan.outputs.run_mocked }}
      run_deploy: ${{ steps.plan.outputs.run_deploy }}
      images_any: ${{ steps.plan.outputs.images_any }}
      images_matrix: ${{ steps.plan.outputs.images_matrix }}
      hash_web: ${{ steps.hash.outputs.hash_web }}
      hash_api: ${{ steps.hash.outputs.hash_api }}
      hash_database: ${{ steps.hash.outputs.hash_database }}
      hash_prototype: ${{ steps.hash.outputs.hash_prototype }}
      hash_e2e: ${{ steps.hash.outputs.hash_e2e }}
      hash_mocked: ${{ steps.hash.outputs.hash_mocked }}
      hash_deploy: ${{ steps.hash.outputs.hash_deploy }}
      hash_image_edge: ${{ steps.hash.outputs.hash_image_edge }}
      hash_image_identity: ${{ steps.hash.outputs.hash_image_identity }}
      hash_image_patients: ${{ steps.hash.outputs.hash_image_patients }}
      hash_image_scheduling: ${{ steps.hash.outputs.hash_image_scheduling }}
      hash_image_billing: ${{ steps.hash.outputs.hash_image_billing }}
      hash_image_inventory: ${{ steps.hash.outputs.hash_image_inventory }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Self-check skip planner
        run: bash .github/scripts/ci-skip.test.sh
      - id: mode
        run: |
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch) echo "full=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "full=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: steps.mode.outputs.full != 'true'
        with:
          token: ${{ github.token }}
          filters: |
            shared:
              - '.github/workflows/**'
              - '.github/scripts/**'
              - '.github/actions/**'
              - 'package.json'
              - 'package-lock.json'
              - 'apps/web/package.json'
              - 'apps/web/package-lock.json'
              - 'backend/global.json'
              - 'backend/Directory.Build.props'
              - 'backend/Directory.Packages.props'
              - 'backend/Hms.slnx'
              - '.editorconfig'
              - 'docker-compose.yml'
              - '.dockerignore'
            frontend:
              - 'apps/web/**'
            backend:
              - 'backend/**'
            migrations:
              - 'supabase/migrations/**'
            sql:
              - 'supabase/**'
              - '.github/scripts/check-migration-versions.sh'
              - '.github/scripts/supabase-ci-sql-tests.sh'
              - '.github/scripts/supabase-ci-hook-smoke.sh'
              - '.github/supabase-ci/**'
            playwright:
              - 'tests/**'
              - 'scripts/dev/**'
              - 'package.json'
              - 'package-lock.json'
            deploy:
              - 'infra/aca/**'
              - '.github/workflows/deploy-aca.yml'
              - '.github/workflows/cleanup.yml'
              - '.github/scripts/aca-rollout.sh'
              - '.github/scripts/aca-cleanup-azure.sh'
              - '.github/scripts/cleanup-github.sh'
              - '.github/scripts/service_changes.py'
              - '.github/scripts/retention.py'
              - '.github/scripts/test-deploy-plan.sh'
              - 'scripts/smoke/**'
              - 'scripts/azure-oidc-setup.sh'
              - 'scripts/verify.sh'
              - 'lefthook.yml'
              - 'CONTRIBUTING.md'
              - 'AGENTS.md'
              - '.cursor/rules/verify-before-commit.mdc'
              - 'docs/deploy.md'
            image_edge:
              - 'backend/edge/**'
              - 'backend/platform/**'
              - 'backend/shared/**'
              - 'backend/global.json'
              - 'backend/Directory.Build.props'
              - 'backend/Directory.Packages.props'
              - '.dockerignore'
            image_identity:
              - 'backend/services/identity/**'
              - 'backend/modules/Identity/**'
              - 'backend/platform/**'
              - 'backend/shared/**'
              - 'backend/global.json'
              - 'backend/Directory.Build.props'
              - 'backend/Directory.Packages.props'
              - '.dockerignore'
            image_patients:
              - 'backend/services/patients/**'
              - 'backend/modules/Patients/**'
              - 'backend/platform/**'
              - 'backend/shared/**'
              - 'backend/global.json'
              - 'backend/Directory.Build.props'
              - 'backend/Directory.Packages.props'
              - '.dockerignore'
            image_scheduling:
              - 'backend/services/scheduling/**'
              - 'backend/modules/Appointments/**'
              - 'backend/platform/**'
              - 'backend/shared/**'
              - 'backend/global.json'
              - 'backend/Directory.Build.props'
              - 'backend/Directory.Packages.props'
              - '.dockerignore'
            image_billing:
              - 'backend/services/billing/**'
              - 'backend/modules/Billing/**'
              - 'backend/platform/**'
              - 'backend/shared/**'
              - 'backend/global.json'
              - 'backend/Directory.Build.props'
              - 'backend/Directory.Packages.props'
              - '.dockerignore'
            image_inventory:
              - 'backend/services/inventory/**'
              - 'backend/modules/Inventory/**'
              - 'backend/platform/**'
              - 'backend/shared/**'
              - 'backend/global.json'
              - 'backend/Directory.Build.props'
              - 'backend/Directory.Packages.props'
              - '.dockerignore'
      - id: hash
        run: bash .github/scripts/ci-input-hashes.sh >> "$GITHUB_OUTPUT"
      - id: cache_web
        if: steps.mode.outputs.full != 'true'
        continue-on-error: true
        uses: ./.github/actions/lookup-pass-marker
        with:
          job: web
          hash: ${{ steps.hash.outputs.hash_web }}
      - id: cache_api
        if: steps.mode.outputs.full != 'true'
        continue-on-error: true
        uses: ./.github/actions/lookup-pass-marker
        with:
          job: api
          hash: ${{ steps.hash.outputs.hash_api }}
      - id: cache_database
        if: steps.mode.outputs.full != 'true'
        continue-on-error: true
        uses: ./.github/actions/lookup-pass-marker
        with:
          job: database
          hash: ${{ steps.hash.outputs.hash_database }}
      - id: cache_prototype
        if: steps.mode.outputs.full != 'true'
        continue-on-error: true
        uses: ./.github/actions/lookup-pass-marker
        with:
          job: prototype
          hash: ${{ steps.hash.outputs.hash_prototype }}
      - id: cache_e2e
        if: steps.mode.outputs.full != 'true'
        continue-on-error: true
        uses: ./.github/actions/lookup-pass-marker
        with:
          job: e2e
          hash: ${{ steps.hash.outputs.hash_e2e }}
      - id: cache_mocked
        if: steps.mode.outputs.full != 'true'
        continue-on-error: true
        uses: ./.github/actions/lookup-pass-marker
        with:
          job: mocked
          hash: ${{ steps.hash.outputs.hash_mocked }}
      - id: cache_deploy
        if: steps.mode.outputs.full != 'true'
        continue-on-error: true
        uses: ./.github/actions/lookup-pass-marker
        with:
          job: deploy-scripts
          hash: ${{ steps.hash.outputs.hash_deploy }}
      - id: cache_image_edge
        if: steps.mode.outputs.full != 'true'
        continue-on-error: true
        uses: ./.github/actions/lookup-pass-marker
        with:
          job: images-edge
          hash: ${{ steps.hash.outputs.hash_image_edge }}
      - id: cache_image_identity
        if: steps.mode.outputs.full != 'true'
        continue-on-error: true
        uses: ./.github/actions/lookup-pass-marker
        with:
          job: images-identity
          hash: ${{ steps.hash.outputs.hash_image_identity }}
      - id: cache_image_patients
        if: steps.mode.outputs.full != 'true'
        continue-on-error: true
        uses: ./.github/actions/lookup-pass-marker
        with:
          job: images-patients
          hash: ${{ steps.hash.outputs.hash_image_patients }}
      - id: cache_image_scheduling
        if: steps.mode.outputs.full != 'true'
        continue-on-error: true
        uses: ./.github/actions/lookup-pass-marker
        with:
          job: images-scheduling
          hash: ${{ steps.hash.outputs.hash_image_scheduling }}
      - id: cache_image_billing
        if: steps.mode.outputs.full != 'true'
        continue-on-error: true
        uses: ./.github/actions/lookup-pass-marker
        with:
          job: images-billing
          hash: ${{ steps.hash.outputs.hash_image_billing }}
      - id: cache_image_inventory
        if: steps.mode.outputs.full != 'true'
        continue-on-error: true
        uses: ./.github/actions/lookup-pass-marker
        with:
          job: images-inventory
          hash: ${{ steps.hash.outputs.hash_image_inventory }}
      - id: plan
        env:
          FULL: ${{ steps.mode.outputs.full }}
          SHARED: ${{ steps.filter.outputs.shared }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          MIGRATIONS: ${{ steps.filter.outputs.migrations }}
          SQL: ${{ steps.filter.outputs.sql }}
          PLAYWRIGHT: ${{ steps.filter.outputs.playwright }}
          DEPLOY: ${{ steps.filter.outputs.deploy }}
          IMAGE_EDGE: ${{ steps.filter.outputs.image_edge }}
          IMAGE_IDENTITY: ${{ steps.filter.outputs.image_identity }}
          IMAGE_PATIENTS: ${{ steps.filter.outputs.image_patients }}
          IMAGE_SCHEDULING: ${{ steps.filter.outputs.image_scheduling }}
          IMAGE_BILLING: ${{ steps.filter.outputs.image_billing }}
          IMAGE_INVENTORY: ${{ steps.filter.outputs.image_inventory }}
          CACHED_WEB: ${{ steps.cache_web.outputs.hit }}
          CACHED_API: ${{ steps.cache_api.outputs.hit }}
          CACHED_DATABASE: ${{ steps.cache_database.outputs.hit }}
          CACHED_PROTOTYPE: ${{ steps.cache_prototype.outputs.hit }}
          CACHED_E2E: ${{ steps.cache_e2e.outputs.hit }}
          CACHED_MOCKED: ${{ steps.cache_mocked.outputs.hit }}
          CACHED_DEPLOY: ${{ steps.cache_deploy.outputs.hit }}
          CACHED_IMAGE_EDGE: ${{ steps.cache_image_edge.outputs.hit }}
          CACHED_IMAGE_IDENTITY: ${{ steps.cache_image_identity.outputs.hit }}
          CACHED_IMAGE_PATIENTS: ${{ steps.cache_image_patients.outputs.hit }}
          CACHED_IMAGE_SCHEDULING: ${{ steps.cache_image_scheduling.outputs.hit }}
          CACHED_IMAGE_BILLING: ${{ steps.cache_image_billing.outputs.hit }}
          CACHED_IMAGE_INVENTORY: ${{ steps.cache_image_inventory.outputs.hit }}
          HASH_IMAGE_EDGE: ${{ steps.hash.outputs.hash_image_edge }}
          HASH_IMAGE_IDENTITY: ${{ steps.hash.outputs.hash_image_identity }}
          HASH_IMAGE_PATIENTS: ${{ steps.hash.outputs.hash_image_patients }}
          HASH_IMAGE_SCHEDULING: ${{ steps.hash.outputs.hash_image_scheduling }}
          HASH_IMAGE_BILLING: ${{ steps.hash.outputs.hash_image_billing }}
          HASH_IMAGE_INVENTORY: ${{ steps.hash.outputs.hash_image_inventory }}
        run: bash .github/scripts/ci-plan.sh >> "$GITHUB_OUTPUT"

  web-run:
    name: Frontend work
    needs: changes
    if: needs.changes.outputs.run_web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Record pass marker
        if: success()
        continue-on-error: true
        uses: ./.github/actions/save-pass-marker
        with:
          job: web
          hash: ${{ needs.changes.outputs.hash_web }}

  web:
    name: Frontend (lint, unit tests, build)
    needs: [changes, web-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Report required check
        run: bash .github/scripts/ci-require-result.sh "${{ needs.changes.result }}" "${{ needs.web-run.result }}"

  api-run:
    name: Backend work
    needs: changes
    if: needs.changes.outputs.run_api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore backend/Hms.slnx
      - run: dotnet build backend/Hms.slnx -c Release --no-restore
      - name: Unit tests (no database)
        run: dotnet test backend/Hms.slnx -c Release --no-build --filter "Category!=Database" --logger "trx;LogFilePrefix=unit" --results-directory test-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-unit-test-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Record pass marker
        if: success()
        continue-on-error: true
        uses: ./.github/actions/save-pass-marker
        with:
          job: api
          hash: ${{ needs.changes.outputs.hash_api }}

  api:
    name: Backend (build + unit tests)
    needs: [changes, api-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Report required check
        run: bash .github/scripts/ci-require-result.sh "${{ needs.changes.result }}" "${{ needs.api-run.result }}"

  database-run:
    name: Database work
    needs: changes
    if: needs.changes.outputs.run_database == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      HMS_DB_TEST_CONNECTION: Host=localhost;Port=5432;Database=hms_sql_test;Username=postgres;Password=postgres
      # Local-only password created by supabase/scripts/local-api-login-role.sql (throwaway CI database).
      HMS_API_TEST_CONNECTION: Host=localhost;Port=5432;Database=hms_sql_test;Username=hms_api_login;Password=hms_api_local_only
    steps:
      - uses: actions/checkout@v7
      - name: Migration chain check (14-digit versions unique; new ones newer than the base branch)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/check-migration-versions.sh
      - name: Schema ownership (service code and new migrations stay in their schema)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/check-schema-ownership.sh
      - name: Install psql client
        run: sudo apt-get update -y && sudo apt-get install -y postgresql-client
      - name: Apply migrations + seed, run SQL tests (hook, API role, RLS)
        run: bash supabase/scripts/run-sql-tests.sh
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Integration (JWT + HTTP) and RLS defense-in-depth tests, through the YARP edge and the services
        run: >-
          dotnet test backend/Hms.slnx -c Release --filter "Category=Database"
          --logger "trx;LogFilePrefix=db" --results-directory test-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-db-test-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Record pass marker
        if: success()
        continue-on-error: true
        uses: ./.github/actions/save-pass-marker
        with:
          job: database
          hash: ${{ needs.changes.outputs.hash_database }}

  database:
    name: SQL/RLS tests + API integration tests (real Postgres)
    needs: [changes, database-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Report required check
        run: bash .github/scripts/ci-require-result.sh "${{ needs.changes.result }}" "${{ needs.database-run.result }}"

  # CI minutes are limited: each image leg runs only when its Docker inputs changed
  # (or a shared file changed and that leg has no pass marker yet).
  images:
    name: Service images (docker build + health smoke, non-required)
    needs: changes
    if: needs.changes.outputs.images_any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Fallback keeps fromJSON valid when `changes` failed and emitted no matrix.
      # The job if still skips unless images_any is true.
      matrix: ${{ fromJSON(needs.changes.outputs.images_matrix || '{"include":[{"name":"edge","dockerfile":"backend/edge/Dockerfile","input_hash":"skipped","cache_job":"images-edge"}]}') }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        if: matrix.name == 'edge'
        run: docker compose -f docker-compose.yml config -q
      - name: docker build ${{ matrix.name }}
        run: docker build -f ${{ matrix.dockerfile }} -t hms-${{ matrix.name }}:ci .
      - name: Boot ${{ matrix.name }} and check /health/live (no database needed)
        run: |
          docker run -d --name hms-${{ matrix.name }} -p 18080:8080 hms-${{ matrix.name }}:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/health/live || true)
            if [ "$code" = "200" ]; then echo "/health/live -> 200 after ${i}s"; exit 0; fi
            sleep 1
          done
          docker logs hms-${{ matrix.name }}
          echo "/health/live never returned 200"; exit 1
      - name: Record pass marker
        if: success()
        continue-on-error: true
        uses: ./.github/actions/save-pass-marker
        with:
          job: ${{ matrix.cache_job }}
          hash: ${{ matrix.input_hash }}

  e2e-run:
    name: Playwright E2E work
    needs: changes
    if: needs.changes.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install psql client
        run: sudo apt-get update -y && sudo apt-get install -y postgresql-client
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix apps/web ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Prepare E2E database (migrations + synthetic seed)
        run: npm run e2e:db
      - name: Build API (edge + identity / patients / scheduling / billing / inventory)
        run: dotnet build backend/Hms.slnx
      # Playwright starts scripts/dev/run-microservices.sh (edge on :8080, services on :8101-8105,
      # one login role each) and waits on the edge's /health/ready.
      - run: npm run e2e
        env:
          HMS_MS_NO_BUILD: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            tests/playwright/playwright-report
            tests/playwright/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Record pass marker
        if: success()
        continue-on-error: true
        uses: ./.github/actions/save-pass-marker
        with:
          job: e2e
          hash: ${{ needs.changes.outputs.hash_e2e }}

  e2e:
    name: Playwright E2E (web + API + mock auth + Postgres)
    needs: [changes, e2e-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Report required check
        run: bash .github/scripts/ci-require-result.sh "${{ needs.changes.result }}" "${{ needs.e2e-run.result }}"

  # ---------------------------------------------------------------------------
  # PROTOTYPE for PR #1 review item Minor 9 (owner: DevOps). NOT a required check.
  # Runs the same migrations, seed and SQL tests on Supabase's real stack (supabase/postgres
  # image + GoTrue via the pinned Supabase CLI) instead of vanilla postgres:17 + the local
  # shim, and smoke-tests the real GoTrue calling identity.custom_access_token_hook.
  # continue-on-error: it has not yet been proven stable on GitHub-hosted runners, so a
  # failure here must not fail the CI run. Do not add it to branch protection until it has
  # been green on several runs (see docs/runbooks/pr1-review-answers.md, Minor 9).
  # ---------------------------------------------------------------------------
  db-supabase-prototype:
    name: DB prototype on Supabase stack (supabase start, non-required)
    needs: changes
    if: needs.changes.outputs.run_prototype == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    env:
      SUPABASE_CLI_VERSION: "2.119.0"
      SB_WORKDIR: .github/supabase-ci
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Install psql client
        run: sudo apt-get update -y && sudo apt-get install -y postgresql-client
      - name: Stage the repo's migrations + seed into the CI-only workdir
        run: |
          cp -R supabase/migrations "$SB_WORKDIR/supabase/migrations"
          cp supabase/seed.sql "$SB_WORKDIR/supabase/seed.sql"
          ls -1 "$SB_WORKDIR/supabase/migrations"
      - name: supabase start (supabase/postgres + GoTrue; applies migrations + seed)
        run: >-
          supabase start --workdir "$SB_WORKDIR"
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Export local stack endpoints (throwaway local demo credentials)
        run: |
          supabase status --workdir "$SB_WORKDIR" -o env > "$RUNNER_TEMP/sb.env"
          echo "status variables: $(cut -d= -f1 "$RUNNER_TEMP/sb.env" | tr '\n' ' ')"
          get() { grep -E "^$1=" "$RUNNER_TEMP/sb.env" | head -n1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//'; }
          api_url="$(get API_URL)"
          db_url="$(get DB_URL)"
          key="$(get PUBLISHABLE_KEY)"
          if [ -z "$key" ]; then key="$(get ANON_KEY)"; fi
          echo "::add-mask::$key"
          admin_url="${db_url/\/\/postgres:/\/\/supabase_admin:}"
          {
            echo "SB_API_URL=$api_url"
            echo "SB_APIKEY=$key"
            echo "SB_DB_URL=$db_url"
            echo "SB_ADMIN_URL=$admin_url"
          } >> "$GITHUB_ENV"
      - name: Smoke query (image, roles, migration history)
        run: |
          psql -X -v ON_ERROR_STOP=1 "$SB_DB_URL" <<'SQL'
          select version();
          select rolname, rolsuper, rolbypassrls, rolcanlogin, rolconnlimit
            from pg_roles
           where rolname in ('postgres', 'supabase_admin', 'supabase_auth_admin', 'authenticated', 'anon', 'service_role', 'hms_api')
           order by 1;
          select count(*) as gotrue_migrations from auth.schema_migrations;
          select version, name from supabase_migrations.schema_migrations order by version;
          select (select count(*) from identity.tenants) as tenants, (select count(*) from patient.patients) as patients;
          SQL
      - name: SQL tests as postgres (hosted parity, non-superuser; informational)
        continue-on-error: true
        env:
          LABEL: as postgres (hosted parity)
        run: DB_URL="$SB_DB_URL" bash .github/scripts/supabase-ci-sql-tests.sh
      - name: SQL tests as supabase_admin (superuser, same privileges as the database job)
        env:
          LABEL: as supabase_admin
        run: DB_URL="$SB_ADMIN_URL" bash .github/scripts/supabase-ci-sql-tests.sh
      - name: Real GoTrue + access token hook + refresh-token reuse smoke test
        env:
          EXPECTED_JWT_EXP: "900"
          REUSE_INTERVAL: "10"
        run: AUTH_URL="$SB_API_URL/auth/v1" APIKEY="$SB_APIKEY" DB_URL="$SB_ADMIN_URL" bash .github/scripts/supabase-ci-hook-smoke.sh
      - name: Container logs on failure
        if: failure()
        run: |
          supabase status --workdir "$SB_WORKDIR" || true
          docker ps -a --format '{{.Names}}\t{{.Status}}'
          for c in $(docker ps -a --format '{{.Names}}' | grep -E '_hms-ci$'); do
            echo "::group::$c"; docker logs --tail 200 "$c" 2>&1 || true; echo "::endgroup::"
          done
      - name: Stop the stack
        if: always()
        run: supabase stop --workdir "$SB_WORKDIR" --no-backup || true
      - name: Record pass marker
        if: success()
        continue-on-error: true
        uses: ./.github/actions/save-pass-marker
        with:
          job: prototype
          hash: ${{ needs.changes.outputs.hash_prototype }}

  # ---------------------------------------------------------------------------
  # Frontend's mocked browser suite (`npm run e2e:mocked`, root package.json; API and Supabase
  # Auth are answered in the page by tests/playwright/mocked/mock-backend.ts, so no DB, .NET or
  # mock-auth server). It is a SEPARATE job so it can never turn the required
  # "Frontend (lint, unit tests, build)" check red. Not required (yet).
  # Runs when web or API/service paths change (same inputs as the full Playwright job,
  # minus the database). Migrations alone do not select it.
  # ---------------------------------------------------------------------------
  web-e2e-mocked:
    name: Web E2E (mocked API, Playwright)
    needs: changes
    if: needs.changes.outputs.run_mocked == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Detect the e2e:mocked suite on this ref
        id: guard
        run: bash .github/scripts/detect-npm-script.sh e2e:mocked tests/playwright/playwright.mocked.config.ts
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Install dependencies (root Playwright + web app)
        if: steps.guard.outputs.present == 'true'
        run: |
          npm ci --no-audit --no-fund
          npm --prefix apps/web ci --no-audit --no-fund
      - name: Resolve Playwright version
        id: pw
        if: steps.guard.outputs.present == 'true'
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        if: steps.guard.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.pw.outputs.version }}
      - name: Install Chromium + OS dependencies
        if: steps.guard.outputs.present == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install OS dependencies only (browsers restored from cache)
        if: steps.guard.outputs.present == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run mocked browser suite
        if: steps.guard.outputs.present == 'true'
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: tests/playwright/playwright-report-mocked
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: tests/playwright/test-results/junit-mocked.xml
        run: npm run e2e:mocked -- --reporter=list,html,junit
      - name: Record pass marker
        if: success()
        continue-on-error: true
        uses: ./.github/actions/save-pass-marker
        with:
          job: mocked
          hash: ${{ needs.changes.outputs.hash_mocked }}
      - uses: actions/upload-artifact@v7
        if: failure() && steps.guard.outputs.present == 'true'
        with:
          name: playwright-report-mocked
          path: |
            tests/playwright/playwright-report-mocked
            tests/playwright/test-results
          retention-days: 7
          if-no-files-found: ignore

  deploy-scripts:
    name: Deploy scripts (plan, rollback, cleanup rules)
    needs: changes
    if: needs.changes.outputs.run_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Plan, rollback, retention, and workflow safety checks
        run: bash .github/scripts/test-deploy-plan.sh
      - name: Record pass marker
        if: success()
        continue-on-error: true
        uses: ./.github/actions/save-pass-marker
        with:
          job: deploy-scripts
          hash: ${{ needs.changes.outputs.hash_deploy }}

  ci-ok:
    name: ci-ok
    needs:
      - changes
      - web
      - web-run
      - api
      - api-run
      - database
      - database-run
      - e2e
      - e2e-run
      - images
      - db-supabase-prototype
      - web-e2e-mocked
      - deploy-scripts
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Fail only if a needed job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash .github/scripts/ci-ok.sh

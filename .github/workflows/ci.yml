name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  web:
    name: Frontend (lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  api:
    name: Backend (build + xUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore backend/Hms.slnx
      - run: dotnet build backend/Hms.slnx -c Release --no-restore
      - name: Unit + API integration tests (no database)
        run: dotnet test backend/Hms.slnx -c Release --no-build --filter "Category!=Database" --logger "trx;LogFilePrefix=api" --results-directory test-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-test-results
          path: test-results

  database:
    name: SQL migrations + RLS/tenant-isolation tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      HMS_DB_TEST_CONNECTION: Host=localhost;Port=5432;Database=hms_sql_test;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v7
      - name: Install psql client
        run: sudo apt-get update -y && sudo apt-get install -y postgresql-client
      - name: Apply migrations + seed, run SQL tests
        run: bash supabase/scripts/run-sql-tests.sh
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: EF Core mapping tests against the migrated database
        run: dotnet test backend/tests/Hms.DatabaseTests -c Release --filter "Category=Database"

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix apps/web ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            tests/playwright/playwright-report
            tests/playwright/test-results
          retention-days: 7

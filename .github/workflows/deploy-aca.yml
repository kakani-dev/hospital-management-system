# Deploy identity, patients, scheduling, and the YARP edge to Azure Container Apps.
#
# Push to main runs CI first. This workflow starts only after that CI run succeeds, builds
# the images whose paths changed, pushes sha-<full 40-character commit sha> to ACR, shifts traffic, and smoke-tests
# through the public edge. A failed health or smoke check puts traffic back on the previous
# revision and fails the run. workflow_dispatch is an emergency hatch (one service and/or an
# existing tag), not the normal path.
#
# Auth is Azure OIDC (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID). No client secret,
# no registry password. Nothing in this workflow waits on a repository variable or a
# GitHub environment reviewer, so a merge to main deploys after CI with no extra click.
# A deploy of ca-hms-identity stores SMTP_PASSWORD as smtp-password and
# SUPABASE_SERVICE_ROLE_KEY as supabase-service-role, and turns on the email dispatcher.
# Identity is not rolled if either secret is empty. Other apps do not receive those secrets.
# The identity hms-db secret (hms_identity_login) is never written. Identity minReplicas
# stays 1. Registry bindings are not changed: patients keeps its existing ACR identity,
# scheduling keeps its system-assigned identity.
#
# Does not deploy the Vercel web app, does not modify medicore-hms-api, does not turn the
# outbox dispatcher on, and does not run a database migration.
# One-time Azure setup: scripts/azure-oidc-setup.sh and docs/deploy.md.
name: Deploy to Azure Container Apps

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Emergency only. One of identity, patients, scheduling, edge. Blank uses change detection, or all four when tag is set."
        required: false
        default: ""
      tag:
        description: "Emergency only. Existing image tag sha-<hex> to roll onto. Blank builds this commit."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-aca
  # A newer push cancels a deploy that has not finished. An emergency dispatch waits its turn
  # so it does not interrupt a rollback already in progress.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  RESOURCE_GROUP: rg-medicore-hms-dev
  ACR_NAME: acrmedicorehmsdev
  ACR_LOGIN_SERVER: acrmedicorehmsdev.azurecr.io

jobs:
  plan:
    name: Plan (changed services)
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.p.outputs.sha }}
      tag: ${{ steps.p.outputs.tag }}
      build: ${{ steps.p.outputs.build }}
      deploy: ${{ steps.p.outputs.deploy }}
      services: ${{ steps.p.outputs.services }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - id: p
        env:
          INPUT_SERVICE: ${{ github.event_name == 'workflow_dispatch' && inputs.service || '' }}
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be 40 hex, got '$SHA'"; exit 1; }
          files="$(mktemp)"
          if [[ -z "$INPUT_TAG" && -z "$INPUT_SERVICE" ]]; then
            if git rev-parse --verify -q 'HEAD^' >/dev/null; then
              git diff --name-only 'HEAD^' HEAD >"$files"
            else
              printf '%s\n' backend/platform/__all__ >"$files"
            fi
          fi
          python3 .github/scripts/service_changes.py plan \
            --sha "$SHA" --service "$INPUT_SERVICE" --tag "$INPUT_TAG" --files "$files" \
            | tee -a "$GITHUB_OUTPUT"
          echo "Changed files considered; see the plan outputs above." >>"$GITHUB_STEP_SUMMARY"

  image:
    name: Image ${{ matrix.service }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      # An empty include is a valid matrix. The fallback covers a skipped plan job,
      # whose outputs are blank; fromJSON of a blank string fails the workflow file.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix || '{"include":[]}') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to ACR with the OIDC token
        run: az acr login --name "$ACR_NAME"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ env.ACR_LOGIN_SERVER }}/hms-${{ matrix.service }}:${{ needs.plan.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=hms-${{ matrix.service }}
          cache-to: type=gha,scope=hms-${{ matrix.service }},mode=max

  deploy:
    name: Deploy and smoke
    needs: [plan, image]
    if: >-
      always() && !cancelled() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.deploy == 'true' &&
      (needs.image.result == 'success' || needs.image.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ needs.plan.outputs.tag }}
      SERVICES: ${{ needs.plan.outputs.services }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Roll out, wait for health, smoke, roll back on failure
        run: |
          set -euo pipefail
          IFS=',' read -r -a services <<<"$SERVICES"
          bash .github/scripts/aca-rollout.sh "${services[@]}"
      - name: Restore previous revisions if this job was cancelled
        if: cancelled()
        run: bash .github/scripts/aca-rollout.sh --rollback-only

# #79: security, load and image gates. Not a required check (ci-ok is unchanged).
# - trivy-fs: every PR and weekly. Dependency CVEs (npm + NuGet lockfiles) and Dockerfile misconfig;
#   fails on fixable CRITICAL findings.
# - trivy-image: weekly / on demand. Builds each service image locally (no push) and scans it.
# - zap-baseline and k6-smoke: weekly / on demand, against the live site. Passive only: the ZAP baseline
#   spiders and reads responses, it sends no attacks; k6 makes a handful of anonymous GETs.
name: Security scans

on:
  pull_request:
  schedule:
    - cron: '30 21 * * 0' # Mondays 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scans-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-fs:
    name: Trivy (dependencies + Dockerfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan dependencies and Dockerfiles
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          skip-dirs: node_modules,apps/web/node_modules
          exit-code: '1'

  trivy-image:
    name: Trivy image (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: edge, file: backend/edge/Dockerfile }
          - { name: identity, file: backend/services/identity/Dockerfile }
          - { name: patients, file: backend/services/patients/Dockerfile }
          - { name: scheduling, file: backend/services/scheduling/Dockerfile }
          - { name: billing, file: backend/services/billing/Dockerfile }
          - { name: inventory, file: backend/services/inventory/Dockerfile }
          - { name: privacy, file: backend/services/privacy/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - name: Build image (local only, not pushed)
        run: docker build -f ${{ matrix.file }} -t hms-${{ matrix.name }}:scan .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hms-${{ matrix.name }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  zap-baseline:
    name: OWASP ZAP baseline (web)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ZAP baseline (passive)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://medicore-hms-three.vercel.app
          cmd_options: '-I'
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline

  k6-smoke:
    name: k6 smoke (edge)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      - uses: grafana/run-k6-action@4082a08c7e40cf6d65863911077dfb60ae0a4f04 # v1.5.0
        with:
          path: tests/load/smoke.js

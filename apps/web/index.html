<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hospital Management System (Sprint 0 foundation, synthetic data only)" />
    <title>HMS</title>
    <script>
      // Apply the saved theme before first paint (no light flash in dark mode). Same storage key and
      // defaults as src/tailux/configs/theme.config.ts.
      (function () {
        var d = document.documentElement
        var mode = 'system'
        try {
          var s = JSON.parse(localStorage.getItem('hms.theme') || 'null')
          if (s && (s.themeMode === 'light' || s.themeMode === 'dark')) mode = s.themeMode
          d.dataset.cardSkin = (s && s.cardSkin) || 'bordered'
        } catch (e) {}
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) d.classList.add('dark')
        d.style.colorScheme = dark ? 'dark' : 'light'
        d.dataset.themeLight = 'slate'
        d.dataset.themeDark = 'cinder'
        d.dataset.themePrimary = 'blue'
      })()
    </script>
  </head>
  <body data-layout="sideblock">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
